; AgentSites PHP settings (production defaults; staging/dev override via APP_DEBUG only)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
date.timezone = UTC

; OPcache: validate_timestamps stays on so a deploy or `config:cache` is picked up within
; revalidate_freq seconds without restarting php-fpm (zero-downtime deploys, spec §18).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
