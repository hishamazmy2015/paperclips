; AgentSites php-fpm pool (spec §5). Sizing is revisited in Phase 7 against the box
; (rule of thumb: max_children ≈ available RAM for PHP / 40 MB).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 60s

; health and metrics for the compose healthcheck and (later) the Prometheus exporter
pm.status_path = /status
ping.path = /ping
ping.response = pong

; log worker output (Laravel logs to stderr) to the container's stderr
catch_workers_output = yes
decorate_workers_output = no
